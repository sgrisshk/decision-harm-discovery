name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: policy_test
          POSTGRES_USER: policy
          POSTGRES_PASSWORD: policy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U policy -d policy_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://policy:policy_test@localhost:5432/policy_test
      TEST_DATABASE_URL: postgresql+psycopg://policy:policy_test@localhost:5432/policy_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: cd apps/api && uv run alembic upgrade head
      - run: cd apps/api && uv run alembic check
      - run: cd apps/api && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run python scripts/check_repository_data.py
      - name: Verify generated analytical artifacts and blind export
        env:
          BLIND_EVALUATION_KEY: ci-only-blind-evaluation-key-00000000000000000000000000000000
        run: |
          make analytical-dataset
          destination="$(mktemp -d)/blind-workspace"
          uv run python scripts/prepare_blind_workspace.py "$destination"
          git diff --exit-code -- synthetic_data
      - run: uvx pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: policy-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: policy-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
