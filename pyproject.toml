[project]
name = "policy-discovery"
version = "0.1.0"
description = "Outcome-driven policy discovery monorepo"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "bcrypt==5.0.0",
  "email-validator==2.3.0",
  "fastapi==0.116.1",
  "polars==1.32.2",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "python-multipart>=0.0.32",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pre-commit==4.3.0",
  "pyright==1.1.403",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = [".", "apps/api", "packages/analytics/src", "packages/schemas/src"]
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
  "slow: excluded from fast CI",
  "analytics: analytical validation tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
#: `docs/benchmark` holds evidence and data artifacts (hash-pinned scratch/evidence scripts, raw
#: JSON), excluded per ADR-107 D13. Executable benchmark code (scripts/, packages/, tests/) stays
#: linted; do not add executable code under docs/benchmark.
#: `docs/analytics/*-evidence` and the one-off `scripts/diagnose_*` / `scripts/review_*` research
#: diagnostics are frozen evidence of the same kind (some are hash-pinned); they are not reformatted.
extend-exclude = [
    "apps/api/migrations/versions",
    "docs/benchmark",
    "docs/analytics",
    "scripts/diagnose_*.py",
    "scripts/review_*.py",
]
#: Without this, `ruff check docs/benchmark` (an explicitly passed path) would still lint it.
force-exclude = true

#: Frozen engine (`discovery-engine-v0.6.2`), validation gates and contract (1.3.0), and the v1
#: generator/scorer are hash-pinned evidence: a plain `ruff format .` (Makefile, CI) must never
#: reformat them (TASK-107 Rev 3). Affects the formatter only; `ruff check` is unchanged.
[tool.ruff.format]
exclude = [
    "packages/analytics/src/policy_analytics/discovery/*.py",
    "packages/analytics/src/policy_analytics/validation/*.py",
    "packages/analytics/src/policy_analytics/synthetic_benchmark.py",
    "scripts/evaluate_benchmark.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/api/app/**/routes.py" = ["B008"]
"apps/api/app/main.py" = ["B008"]
"apps/api/app/auth/dependencies.py" = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["apps/api/app", "packages/analytics/src", "packages/schemas/src", "scripts", "tools"]
exclude = ["apps/api/migrations", "scripts/diagnose_*.py", "scripts/review_*.py"]
extraPaths = ["apps/api", "packages/analytics/src", "packages/schemas/src"]
